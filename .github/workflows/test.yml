name: Test & Deploy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  # Allows you to run this workflow manually from the Actions tab
  # https://docs.github.com/en/actions/managing-workflow-runs/manually-running-a-workflow
  workflow_dispatch:

jobs:
  # Test job is always triggered as continuous integration
  test:
    runs-on: ubuntu-latest
    steps:
    - name: ☑️ Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: 💎 Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: 🧪 Install gems
      run: |
        bundle install

    - name: 🔧 Build & Test
      run: |
        JEKYLL_ENV=test bundle exec jekyll build
        JEKYLL_ENV=test bundle exec jekyll doctor
        SKIP_BUILD=true bundle exec rake test

  # Deploy job is triggered only pushed to main branch && CI passed
  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: ☑️ Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: 💎 Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: 🧪 Install gems
      run: |
        bundle install

    - name: 🔧 Build
      run: |
        JEKYLL_ENV=production bundle exec jekyll build

    # 公式の Pages の action で配る。以前は第三者の peaceiris/actions-gh-pages に書き込みのトークンを渡し、
    # gh-pages ブランチへ push していた。ここではビルドした _site を成果物として上げ、下の pages ジョブが配る
    - name: 📦 Upload site for GitHub Pages
      if:   github.ref == 'refs/heads/main' && job.status == 'success'
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./_site

  pages:
    name: 🚀 Deploy to GitHub Pages
    needs: deploy
    if:   github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 日次の更新（scheduler_daily.yml）と重ならないよう、Pages への配布は 1 つずつ動かす
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages:    write  # Pages に配る
      id-token: write  # 配布元がこの workflow であることを確かめる
    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}
    steps:
    - id:   deployment
      uses: actions/deploy-pages@v5
